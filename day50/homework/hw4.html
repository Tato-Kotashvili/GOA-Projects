<!-- ჩვენ ვისწავლეთ display: flex

 flex-direction: row/column/reverse-row/column-reverse --იგი ცვლის შვილი ელემენტების მიმდევრობასა და მიმართულებას
 
 justify-content: start/center/end --იგი გვაძლევს საშუალებას გავაკონტროლოთ შვილი ელემენტების მდებარეობა ox ღერძზე
 
 align-items: start/center/end     --იგი გვაძლევს საშუალებას გავაკონტროლოთ შვილი ელემენტების მდებარეობა oy ღერძზე
 
 justify-content: space-between/space-around/space-evenly         --იგი გვაძლევს საშუალებას გავაკონტროლოთ ცარიელი ადგილი შვილ ელემენტებს შორის
 
 gap: რაიმე რაოდენობის px          --იგი გვაძლევს საშუალებას განვსაზღვროთ მანძილი შვილ ელემენტებს შორის
 
 flex-wrap: wrap/wrap-reverse/no-wrap--იგი გვაძლევს საშუალებას "შევფუთოთ" ელემენტები მშობელ ელემენტებში-->
