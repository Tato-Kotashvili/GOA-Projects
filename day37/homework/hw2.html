<!-- HEX არის ფერის კოდი, რომელიც გამოიყენება ვებ დიზაინში და გრაფიკულ დიზაინში. ის მუშაობს იმით, რომ ფერი წარმოდგენილია ექვსი სიმბოლოსგან შემდგარი კოდით, რომელიც იწყება # სიმბოლოთი. თითოეული წყვილი სიმბოლოები წარმოადგენს წითელ, მწვანე და ლურჯ ფერს (RGB) და მათი მნიშვნელობა 00-დან FF-მდე მერყეობს, რაც ნიშნავს 0-დან 255-მდე რაოდენობას. მაგალითად, #FF0000 წარმოადგენს წითელ ფერს, #00FF00 მწვანეს და #0000FF ლურჯს. HEX კოდები ხშირად გამოიყენება ვებ გვერდების სტილში CSS-ში ფერის განსაზღვრისთვის. -->
