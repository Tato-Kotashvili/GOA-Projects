ამ parent დივში შექმენი ერთ img თეგი და დაამატე ფოტო, ამ ფოტოს მიეცი სიმაღლე 40% ,შემდეგ კომენტარის სახით ახსენით თუ რა მოხდა დივის და ფოტოს შემთხვევაში -->

    რაც ნიშნავს, რომ ფოტოს სიმაღლე უდრის parent div-ის height-ზე (400px) *40% =160px -->
</body>
